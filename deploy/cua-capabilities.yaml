# 猎聘 CUA 驱动能力清单(2026-09-30 v4)
#
# 现状与定位(2026-09-30 全量替换定稿后) :
#   * 本清单仅为参考样例,当前部署不推荐使用 manifest 模式——
#     attach 的 UI 原生下载需要 get_window_state/hotkey/click 等 UIA 工具,
#     而 driver 硬性限制"声明 browser.origins 的清单不得同时允许 generic 输入工具"
#     (启动即拒:origin-scoped capability manifests cannot allow 'click'...)。
#   * 推荐启动:`cua-driver serve --dangerously-bypass-approvals`(无 manifest;工具面全开,
#     但调用链仅限本机自动化)。
#
# 历史用途:与 --dangerously-bypass-approvals 组合,将审批绕过/工具面收窄到猎聘自动化范围。
#
# v4 变更(2026-09-30,全量替换不保留 liepin-cli):
#   attach 的 PDF 下载改走"UIA/热键原生点击"通道(browser_download 的宿主确认流在 call
#   通道不可用),需 get_window_state/hotkey/click/set_value 等工具;
#   按 driver 约束"声明 browser.origins 的清单不得同时允许 generic 输入工具"
#   (启动即拒),v4 不再声明 browser.origins——导航目标仍由驱动代码固定
#   (about:blank / lpt.liepin.com 域名),实际风险面可控。
#
# 启动示例:
#   cua-driver serve --dangerously-bypass-approvals --capability-manifest .\deploy\cua-capabilities.yaml --approve-capability-manifest

version: 3
expires_after: 24h
idle_timeout: 4h

allow:
  tools:
    - start_session
    - end_session
    - list_windows
    - browser_prepare
    - get_browser_state
    - browser_navigate
    - browser_click
    - browser_type
    - browser_pointer
    - browser_download
    # v4 增补:UIA/窗口工具(PDF 预览器下载按钮 + 原生对话框操作)
    - get_window_state
    - click
    - type_text
    - set_value
    - hotkey
    - press_key
    - bring_to_front
    - right_click

resources:
  apps:
    # Chrome 窗口须在清单内,否则 browser_prepare/get_browser_state
    # 拒绝:desktop pid/window is outside the capability manifest(2026-09-30 真机)
    - executable: C:\Program Files\Google\Chrome\Application\chrome.exe
      launch: true
      windows: all
      terminate: driver_launched

  browser:
    profiles:
      - kind: existing_profile
    origins:
      # 2026-09-30 真机:origins 为浏览器操作白名单,不可为空(否则 browser_navigate
      # 报 "live browser origin is outside the capability manifest")
      - about:blank
      - https://lpt.liepin.com
      - https://tdoss.liepin.com
      - https://api-c.liepin.com

  desktop:
    # list_windows 属"desktop display observation",需置 true(2026-09-30 真机)
    display: true

  files:
    # 附件下载落盘目录须在清单内(2026-09-30 真机);后端 attachWorkDir() 位于系统临时目录下
    write:
      - dir: C:\Users\Administrator\AppData\Local\Temp
        recursive: true
